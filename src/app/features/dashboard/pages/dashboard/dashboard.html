<div class="dashboard-container">
  <mat-drawer-container class="drawer-container">

    <mat-drawer
      #drawer
      [mode]="isHandset ? 'over' : 'side'"
      [opened]="!isHandset"
      class="drawer"
    >
      <!-- Header -->
      <div class="drawer-header">
        <div class="logo">
          <mat-icon class="logo-icon">menu_book</mat-icon>
          <span class="logo-text">iLearningHub</span>
        </div>
        @if (isHandset) {
          <button class="close-sidebar" (click)="drawer.close()">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      <div class="drawer-profile">
        <img [src]="userAvatar" alt="Avatar" class="profile-avatar">
        <div class="profile-info">
          <p class="profile-name">{{ userName }}</p>
          <p class="profile-role">{{ userRole === 'estudiante' ? 'Estudiante' : 'Docente' }}</p>
        </div>
      </div>

      <mat-nav-list class="nav-list">
        @for (item of menuItems; track item.route) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive="active"
            #rla="routerLinkActive"
            [class.active]="rla.isActive"
            (click)="isHandset ? drawer.close() : null"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>

      <div class="drawer-footer">
        <button mat-button class="logout-btn" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Cerrar Sesión
        </button>
      </div>
    </mat-drawer>

    <mat-drawer-content class="drawer-content">

      <mat-toolbar class="top-bar">
        <div class="top-bar-left">
          <button mat-icon-button class="menu-toggle" (click)="drawer.toggle()">
            <mat-icon>menu</mat-icon>
          </button>
          <span class="page-title">Dashboard</span>
        </div>
        <div class="top-bar-right">
          <button mat-icon-button class="notif-btn">
            <mat-icon>notifications</mat-icon>
            <span class="notif-dot"></span>
          </button>
          <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
            <img [src]="userAvatar" alt="Avatar" class="top-avatar">
            <span class="user-name">{{ userName.split(' ')[0] }}</span>
            <mat-icon>arrow_drop_down</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu">
            <button mat-menu-item>
              <mat-icon>account_circle</mat-icon>
              <span>Mi Perfil</span>
            </button>
            <button mat-menu-item>
              <mat-icon>settings</mat-icon>
              <span>Configuración</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Cerrar Sesión</span>
            </button>
          </mat-menu>
        </div>
      </mat-toolbar>

      <div class="content-area">
        <router-outlet></router-outlet>
      </div>

    </mat-drawer-content>
  </mat-drawer-container>
</div>
